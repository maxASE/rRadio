# Example nginx site for rRadio.
# Web UI and streams on one hostname, e.g. https://radio.home.lan
# Set PUBLIC_STREAM_BASE=https://radio.home.lan in .env so the .m3u/.pls
# links point here instead of at port 8000.

server {
    listen 80;
    # listen 443 ssl;  ssl_certificate ...;  ssl_certificate_key ...;
    server_name radio.home.lan;

    # Streams of every channel (/radio.mp3, /anna.aac, ...): no buffering, long
    # timeouts, so listeners don't get cut off. Matching all mounts means a new
    # channel plays without touching nginx.
    location ~ ^/[a-z0-9_-]+\.(mp3|aac|opus)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Web UI and API.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
