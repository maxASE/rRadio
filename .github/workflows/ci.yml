name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

# Runs on Max's own home server (a self-hosted runner labelled "Linux"), so it
# uses no GitHub Actions minutes on this private repository.
jobs:
  check:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Check the Liquidsoap script
        run: docker run --rm -v "$PWD/liquidsoap:/radio" savonet/liquidsoap:v2.4.6 --check /radio/radio.liq
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the controller
        run: |
          pip install -r controller/requirements.txt
          python -m compileall -q controller/app
          cd controller && CONFIG_PATH=/tmp/c.yaml STATE_DB=/tmp/s.db python -c "import app.main"
      - name: Test the controller
        run: |
          pip install pytest
          cd controller && python -m pytest -q
      - name: Check docker-compose.yml
        run: cp .env.example .env && docker compose config -q

  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rradio-controller
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
